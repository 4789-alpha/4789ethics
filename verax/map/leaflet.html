<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>VERAX Karte</title>
  
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.5.1/gpx.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; font:14px system-ui; } header,nav,.skip-link,details,footer{display:none} p{padding:8px;margin:0}
    #map { height: calc(100vh - 80px); min-height:320px; width: 100vw; }
  </style>
</head>
<body>
  <a class="skip-link" href="#map">Skip to map</a>
  <div id="op_background" aria-hidden="true"></div>
  <header>
    <h1>VERAX Karte</h1>
  </header>
  <nav aria-label="Hauptnavigation">
    <a href="../index.html" class="icon-only" aria-label="Home">🏠</a>
    <a href="https://github.com/4789-alpha/4789ethics/tree/main/verax" class="icon-only readme-link" aria-label="Hilfe">?</a>
  </nav>
  <p><button id="locate_btn" type="button">Meinen Standort anzeigen</button> <span id="location_status" role="status"></span></p><div id="map"></div>
  <details class="card" style="max-width:40em;margin:1em auto;">
    <summary>Hinweise</summary>
    <ul>
      <li>Diese Struktur wird ohne Gewährleistung bereitgestellt.</li>
      <li>Die Nutzung erfolgt auf eigene Verantwortung.</li>
      <li>4789 ist ein Standard für Verantwortung, keine Person.</li>
      
    </ul>
  </details>
  <footer>
    <p>Beta-Version – Feedback willkommen.</p>
  </footer>
  <script>
    const map = L.map('map', {zoomControl: false}).setView([46.8345, 7.4953], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Tile-Layer (OSM international)
    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // GPX-Track laden (Pfad anpassen)
    const gpxTrack = new L.GPX('limen-muehlethurnen.gpx', {
      async: true
    }).on('loaded', function(e) {
      map.fitBounds(e.target.getBounds());
    }).addTo(map);



    // GPS-Ortung aktivieren
    function onLocationFound(e) {
      const radius = e.accuracy;
      L.marker(e.latlng)
        .addTo(map)
        .bindPopup("±" + Math.round(radius) + " m");
      L.circle(e.latlng, radius).addTo(map);
    }

    function onLocationError(e) {
      document.getElementById('location_status').textContent = 'Standort nicht verfügbar. Die Karte bleibt frei bedienbar.';
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);

    document.getElementById('locate_btn').addEventListener('click', () => map.locate({setView: true, watch: false}));
  </script>
  
</body>
</html>
