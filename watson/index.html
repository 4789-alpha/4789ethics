<!doctype html>
<html lang="de-CH">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Watson · Private Leseansicht</title>
<style>
  :root { color-scheme: dark; background: #000; color: #eee; font: 1rem/1.45 system-ui, sans-serif; }
  body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem 1rem; padding: .8rem 1rem; border-bottom: 1px solid #444; }
  a { color: #b8dfbb; }
  button { font: inherit; padding: .35rem .65rem; }
  iframe { box-sizing: border-box; width: 100%; height: 100%; min-height: 75vh; border: 0; }
  iframe[hidden], header[hidden] { display: none; }
  body:has(header[hidden]) { grid-template-rows: 1fr; }
  body:has(header[hidden]) iframe { height: 100dvh; }
</style>
<header>
  <strong>Watson · Private Leseansicht</strong>
  <button id="connect">Leseansicht verbinden</button>
  <a id="direct-reader" href="https://watson-leseansicht-privat.rafhimself.chatgpt.site/watson/" target="_blank" rel="noopener noreferrer">Separat öffnen</a>
  <span id="status" role="status">Bei Bedarf im neuen Fenster mit ChatGPT anmelden.</span>
</header>
<iframe id="reader" title="Watson-Leseansicht" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
<script type="module">
  const origin = 'https://watson-leseansicht-privat.rafhimself.chatgpt.site';
  const reader = document.querySelector('#reader');
  const status = document.querySelector('#status');
  const toolbar = document.querySelector('header');
  let connection, timer;
  let requestId = 0;
  let path = '/watson/';
  function load() {
    document.querySelector('#direct-reader').href = new URL(path, origin).href;
    if (!connection || connection.closed) {
      toolbar.hidden = false;
      status.textContent = 'Das Verbindungsfenster ist geschlossen. Bitte erneut verbinden.';
      return;
    }
    status.textContent = 'Watson wird geladen …';
    connection.postMessage({type:'watson-fetch', id:++requestId, path}, origin);
    clearTimeout(timer);
    timer = setTimeout(() => {
      toolbar.hidden = false;
      status.textContent = 'Der Abruf dauert zu lange. Bitte erneut verbinden oder die Ansicht separat öffnen.';
    }, 25000);
  }
  document.querySelector('#connect').addEventListener('click', () => {
    clearTimeout(timer);
    connection = window.open(origin + '/verbindung', 'watson-verbindung', 'popup,width=560,height=690');
    status.textContent = connection
      ? 'Falls nötig anmelden und danach hier erneut auf «Leseansicht verbinden» klicken.'
      : 'Der Browser hat das Anmeldefenster blockiert. Erlaube Pop-ups oder öffne die Ansicht separat.';
  });
  function openReaderLink(href) {
    if (typeof href !== 'string') return;
    let destination;
    try { destination = new URL(href, origin); } catch { return; }
    if (destination.origin !== origin || !destination.pathname.startsWith('/watson/')) return;
    const next = destination.pathname + destination.search;
    if (next === path && destination.hash) {
      let id = destination.hash.slice(1);
      try { id = decodeURIComponent(id); } catch {}
      reader.contentDocument?.getElementById(id)?.scrollIntoView();
      return;
    }
    path = next;
    load();
  }
  addEventListener('message', event => {
    if (event.origin === location.origin && event.source === reader.contentWindow &&
        event.data?.type === 'watson-open-link') {
      openReaderLink(event.data.href);
      return;
    }
    if (event.origin !== origin || event.source !== connection) return;
    const message = event.data;
    if (message?.type === 'watson-ready') {
      load();
      return;
    }
    if (message?.type !== 'watson-result' || message.id !== requestId) return;
    clearTimeout(timer);
    if (!message.ok || typeof message.html !== 'string') {
      toolbar.hidden = false;
      status.textContent = 'Watson konnte nicht geladen werden. Bitte erneut verbinden.';
      return;
    }
    // Disable scripts in the reader document while allowing original video frames.
    const policy = "default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src https: data:; media-src https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.watson.ch; form-action 'none'; base-uri 'none'";
    reader.srcdoc = message.html.includes('<meta http-equiv="Content-Security-Policy" content="default-src')
      ? message.html
      : '<!doctype html><meta http-equiv="Content-Security-Policy" content="' + policy + '">' + message.html;
    reader.hidden = false;
    toolbar.hidden = true;
    status.textContent = 'Verbunden';
  });
  reader.addEventListener('load', () => {
    const content = reader.contentDocument;
    if (!content) return;
    for (const link of content.querySelectorAll('a[href]')) {
      const href = link.getAttribute('href');
      if (href.startsWith('#')) continue;
      const destination = new URL(href, origin);
      if (destination.origin !== origin || !destination.pathname.startsWith('/watson/')) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        continue;
      }
      link.addEventListener('click', event => {
        event.preventDefault();
        openReaderLink(destination.href);
      });
    }
  });
</script>
</html>
