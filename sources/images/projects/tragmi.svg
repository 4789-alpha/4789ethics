<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Tragmi verbindet Projekte mit Unterstützung</title><desc id="desc">Ein Projekt mit Ziel und Bedarf wird mit passenden Fördernden verbunden. Die drei Schritte sind Projekt vorstellen, Unterstützung finden und Beiträge sichtbar machen.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#284b43" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d6bb67"/></marker></defs><rect width="900" height="480" fill="#153a32"/><rect width="900" height="480" fill="url(#grid)"/><g fill="none" stroke="#d6bb67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="55" y="142" width="210" height="200" rx="14" fill="#244e42"/><path d="M87 189H207M87 218H230M87 247H192M87 290H166"/><path d="M284 245H362M549 245H631" marker-end="url(#arrow)"/><circle cx="456" cy="245" r="69" fill="#244e42"/><path d="M422 245H490M456 211V279"/><circle cx="711" cy="180" r="23"/><circle cx="786" cy="254" r="23"/><circle cx="706" cy="320" r="23"/><path d="M730 198L767 237M764 270L729 305M709 204L707 294" stroke="#8db7a5"/><g stroke="none" fill="#e8e5d7" font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><text x="160" y="105">Projekt vorstellen</text><text x="456" y="105">Passend verbinden</text><text x="742" y="105">Gemeinsam tragen</text><text x="160" y="397" font-size="16">Ziel · Idee · Bedarf</text><text x="456" y="397" font-size="16">KI-gestützte Eingabe</text><text x="742" y="397" font-size="16">Gönner · Sponsoren</text></g></g></svg>