<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Aarulon und Aari.X</title><desc id="desc">Aari.X verbindet den Sprach- und Datenkern, dessen Weiterentwicklung und eine getrennte öffentliche Instanz. Ein lokales Archiv ist Teil des Konzepts.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#284b43" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d6bb67"/></marker></defs><rect width="900" height="480" fill="#153a32"/><rect width="900" height="480" fill="url(#grid)"/><g fill="none" stroke="#d6bb67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="62" y="74" width="226" height="100" rx="12" fill="#244e42"/><rect x="612" y="74" width="226" height="100" rx="12" fill="#244e42"/><rect x="62" y="312" width="226" height="100" rx="12" fill="#244e42"/><rect x="612" y="312" width="226" height="100" rx="12" fill="#244e42"/><circle cx="450" cy="243" r="77" fill="#244e42"/><path d="M286 154L375 209M523 209L613 154M375 280L287 332M525 280L612 332" marker-start="url(#arrow)" marker-end="url(#arrow)"/><g stroke="none" fill="#e8e5d7" font-family="Arial,sans-serif" text-anchor="middle"><text x="175" y="116" font-size="24">Aari v1</text><text x="175" y="147" font-size="17">Sprache &amp; Daten</text><text x="725" y="116" font-size="24">Aari v2</text><text x="725" y="147" font-size="17">Weiterentwicklung</text><text x="450" y="239" font-size="29">Aari.X</text><text x="450" y="271" font-size="17">Austausch</text><text x="175" y="353" font-size="24">Archiv</text><text x="175" y="385" font-size="17">Inhalte wiederfinden</text><text x="725" y="353" font-size="24">Aari v4</text><text x="725" y="385" font-size="17">Öffentliche Instanz</text></g></g></svg>